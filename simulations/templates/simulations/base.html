{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FluidaLab{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{% static 'simulations/css/hydraulic_simulation.css' %}"
    >
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Navegación principal">
            <a
                class="brand"
                href="{% url 'simulations:hydraulic_simulation' %}"
            >
                FluidaLab
            </a>

            <div class="nav-links">
                {% if request.user.is_authenticated %}
                    <a href="{% url 'simulations:hydraulic_simulation' %}">
                        Nueva simulación
                    </a>

                    <a href="{% url 'simulations:simulation_list' %}">
                        Mis simulaciones
                    </a>

                    <span class="user-info">
                        {{ request.user.username }}
                    </span>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="logout-button">
                            Cerrar sesión
                        </button>
                    </form>
                {% endif %}
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
